spring:
  application:
    name: employee-service
  
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 9093

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,beans,mappings
  endpoint:
    health:
      show-details: always
